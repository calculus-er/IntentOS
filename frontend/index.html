<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IntentOS — Execute natural language intents on your local machine." />
    <title>Edith — IntentOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Ambient background blobs -->
    <div class="ambient">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <main class="app-shell" id="app-shell">
      <!-- Logo / Branding -->
      <div class="brand">
        <div class="brand-icon" id="brand-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="url(#grad)" stroke-width="2.5" />
            <path d="M16 24 L22 30 L32 18" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48">
                <stop offset="0%" stop-color="#a78bfa" />
                <stop offset="100%" stop-color="#6ee7b7" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="brand-name">Edith</h1>
        <p class="brand-tagline">At your service, sir. Type or press Ctrl+Space.</p>
      </div>

      <!-- Search bar -->
      <form class="search-bar" id="search-form" autocomplete="off">
        <div class="search-glow"></div>
        <div class="search-inner">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="intent-input"
            class="search-input"
            placeholder="e.g. Prepare for DSA test"
            required
          />
          <button type="submit" class="search-btn" id="submit-btn" aria-label="Execute intent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </div>
      </form>

      <!-- Status / Results area -->
      <section class="results" id="results" aria-live="polite"></section>

      <!-- Keyboard hint -->
      <p class="hint" id="hint"><kbd>Enter</kbd> to execute &middot; <kbd>Ctrl+Space</kbd> for voice</p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
